# Install once per clone:  pre-commit install --hook-type pre-commit --hook-type pre-push
# The same checks run in CI, so a skipped local hook can't sneak a secret or media file in.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        stages: [pre-commit, pre-push]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: no-media
        name: no rich media outside docs/
        entry: python scripts/check_no_media.py
        language: system
        pass_filenames: true
        stages: [pre-commit, pre-push]
