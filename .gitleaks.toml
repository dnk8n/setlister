# Default gitleaks rules plus Setlister-specific ones. https://github.com/gitleaks/gitleaks
[extend]
useDefault = true

[[rules]]
id = "setlister-env-assignment"
description = "A SETLISTER_* secret assigned a value"
regex = '''SETLISTER_[A-Z_]*(KEY|TOKEN|SECRET)\s*[=:]\s*['"]?[A-Za-z0-9_\-]{8,}'''

[[rules]]
id = "discogs-token"
description = "Discogs personal access token"
regex = '''(?i)discogs[^\n]{0,20}['"=: ]([A-Za-z0-9]{40})\b'''

[allowlist]
paths = ['''\.env\.example$''']
