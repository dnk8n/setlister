[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "setlister"
version = "0.1.0"
description = "Turn an online DJ/live set into a timestamped, linked, annotated tracklist."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Setlister contributors" }]
keywords = ["dj", "tracklist", "setlist", "audio-fingerprinting", "music-information-retrieval"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Environment :: Console",
]
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2.6",
  "platformdirs>=4",
  "keyring>=25",
  "python-dotenv>=1",
  "numpy>=1.26",
  "scipy>=1.11",
  "librosa>=0.10",
  "yt-dlp>=2024.8",
  "pyacoustid>=1.3",
  "musicbrainzngs>=0.7",
  "python3-discogs-client>=2.7",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  # Unofficial Shazam client: free and the most effective free recogniser for DJ mixes.
  # Not an official API (see docs/providers.md); disable with identify.shazam = false.
  "shazamio>=0.6",
]

[project.optional-dependencies]
# Track notes written by an LLM. Default model is a free local one via Ollama.
llm = ["litellm>=1.40"]
dev = ["pytest>=8", "ruff>=0.5", "pre-commit>=3.7"]

[project.scripts]
setlister = "setlister.cli:app"

[project.urls]
Homepage = "https://github.com/dnk8n/setlister"
Issues = "https://github.com/dnk8n/setlister/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/setlister"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # the formatter handles line length

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet access (deselect with -m 'not network')"]
addopts = "-m 'not network'"
